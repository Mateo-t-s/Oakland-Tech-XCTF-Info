<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us Wireframe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">

        <div class="row mb-3">
            <div class="col-12">
                <div class="box header-box d-flex align-items-center justify-content-center text-center">
                    Join us
                </div>
            </div>
        </div>

        <div class="row g-3">

            <div class="col-12 col-md-6">
                <div class="box left-tall-box h-100 d-flex align-items-center justify-content-center text-center p-3">
                    Info:<br>
                    Tryout dates,<br>
                    Attendance requirements
                </div>
            </div>

            <div class="col-12 col-md-6 d-flex flex-column gap-3">
                <div
                    class="box right-top-box flex-grow-1 d-flex align-items-center justify-content-center text-center p-3">
                    Picture of us at practice
                </div>
                <div class="box right-bottom-box d-flex align-items-center justify-content-center text-center p-3">
                    contacts
                </div>
            </div>

        </div>

    </div>
</body>

</html>
